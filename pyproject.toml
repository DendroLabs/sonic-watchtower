[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-watchtower"
version = "0.1.0"
description = "Distributed read-only network observer for SONiC switches"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "fakeredis>=2.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-redis",
    "grpcio-tools>=1.60",
]

[project.scripts]
watchtower = "watchtower.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sonic_vs: integration tests requiring a running SONiC VS instance"]
addopts = "-m 'not sonic_vs'"

[tool.ruff]
target-version = "py311"
line-length = 99
exclude = ["watchtower/peer/proto/watchtower_pb2.py", "watchtower/peer/proto/watchtower_pb2_grpc.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "SIM108",  # ternary operator -- sometimes if/else is clearer
]

[tool.ruff.lint.isort]
known-first-party = ["watchtower"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["fakeredis.*", "redis.*", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["watchtower.peer.proto.*", "watchtower.peer.server", "watchtower.peer.client"]
ignore_errors = true
